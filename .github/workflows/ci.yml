name: Docs CI
on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate documentation files
        run: npm run lint:content
      - name: Build and type check static site
        run: npm run build
      - name: Verify generated pages
        run: |
          test -f dist/index.html
          test -f dist/plugins/index.html
          test -f dist/blog/index.html
